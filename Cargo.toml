[package]
name = "craft-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
bytes = "1"
octocrab = "0.54"
git2 = { version = "0.21", default-features = false, features = ["https"] }
cargo_metadata = "0.23.1"
regex = "1.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
toml = "1.2.2"
